services:
  api:
    build: .
    container_name: auction-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auction
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:17-alpine
    container_name: auction-postgres
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - auction-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auction"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: auction-redis
    ports:
      - "6379:6379"
    volumes:
      - auction-redis-data:/data
volumes:
  auction-postgres-data:
  auction-redis-data:
